# Gabarit de surcharge MACHINE. Copie-le en config/local.toml (gitignored) et adapte :
#   cp config/local.example.toml config/local.toml
# Surcharge defaults.toml avec ce qui est propre à TA machine (binaires, offload GPU, racine
# des projets) + tes SECRETS. Décommenter les options utiles et remplacer les marqueurs <...>.

# ============================ Serveur (llama.cpp) ============================
[server]

# Chemin absolu des binaires si absents du PATH
# bin = "<chemin-du-binaire-llama-server>"
# swap_bin = "<chemin-du-binaire-llama-swap>"

# Binaire maison compilé avec des PR llama.cpp non mergées : la veille quotidienne affiche
# un bandeau quand un build officiel plus récent sort (commande de recompilation tant
# qu'une PR est ouverte, `uv run loom-setup` quand toutes sont mergées). N'installe rien.
# track_prs = [<numero-de-PR>]
# rebuild_hint = "<commande-de-recompilation>"

# ============================ Override GPU / CPU =============================
[override]

# Laisser la détection automatique ou utiliser la valeur issue de la calibration.
# n_gpu_layers = <nombre-de-couches-GPU>

# ================================= Outils ===================================
[tools]

# Racine des projets sur cette machine (périmètre des outils)
# workspace_dir = "<racine-des-projets>"

# ============================== Chat / runtime ==============================
[chat]

# Modèle chargé au démarrage (id d'un modèle local ou distant ci-dessous)
# default_model = "<identifiant-du-modele>"

# Serveur d'outils tiers local (décommente et adapte ; secrets dans ce fichier gitignoré).
# [[mcp_servers]]
# name = "exemple"
# transport = "stdio"
# command = "uvx"
# args = ["mon-serveur-mcp"]
# env = { API_KEY = "..." }
# enabled = true
# timeout_s = 10

# ============================= Modèles distants =============================
# Les distants ne vivent PAS ici : un dossier par modèle, comme les locaux —
#   <models_root>/remote/<id>/model.toml   (gabarit : loom/models/_TEMPLATE/remote-model.toml)
# La voie royale : « /add-model distant » dans le chat, ou le panneau engrenage de l'UI.
# Les réglages standard communs à tous les distants vont dans la table [remote]
# (defaults.toml, surchargeable ici) ; le model.toml de chaque dossier surcharge tout.
