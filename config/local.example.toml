# Gabarit de surcharge MACHINE. Copie-le en config/local.toml (gitignored) et adapte :
#   cp config/local.example.toml config/local.toml
# Surcharge defaults.toml avec ce qui est propre à TA machine (binaires, offload GPU, racine
# des projets) + tes SECRETS. Valeurs ci-dessous : purement illustratives, à adapter.

# ============================ Serveur (llama.cpp) ============================
[server]

# Chemin absolu des binaires si absents du PATH
bin = "C:/tools/llama/llama-server.exe"
swap_bin = "C:/tools/llama/llama-swap.exe"

# ============================ Override GPU / CPU =============================
[override]

# Offload complet -ngl 99 si le modèle tient dans ta VRAM (sinon spill).
n_gpu_layers = 99

# ================================= Outils ===================================
[tools]

# Racine des projets sur cette machine (périmètre des outils)
workspace_dir = "C:/Users/<toi>/Documents"

# ============================== Chat / runtime ==============================
[chat]

# Modèle chargé au démarrage (id d'un modèle local ou distant ci-dessous)
default_model = "glm-distant"

# ============================= Modèles distants =============================
# API OpenAI-compatible ; s'ajoute au sélecteur à côté des locaux. NE mets JAMAIS ta vraie
# clé dans un fichier partagé : ce gabarit ne porte que des placeholders. Éditable aussi via
# la console de l'UI (onglet Modèles distants).
[[remote_models]]

# Nom affiché dans le sélecteur
id = "glm-distant"

# Endpoint du provider + id du modèle CÔTÉ provider
base_url = "https://api.z.ai/api/paas/v4"
model = "glm-5.2"

# Clé en clair, ou api_key_env = "GLM_API_KEY" (variable d'env)
api_key = "<TA_CLE_ICI>"

# Fenêtre de contexte : rarement publiée par l'API -> source de vérité = la DOC officielle
# (ex. glm-5.2 = 1000000 sur docs.z.ai). Les providers qui l'exposent (OpenRouter, vLLM) sont
# lus tout seuls ; cette valeur ne sert que de repli.
context = 1000000

# PAS de max_tokens : un distant prend la limite de sortie DU PROVIDER (sa machine n'a pas les
# contraintes du local). N'en ajoute un que pour BORNER volontairement le coût.
