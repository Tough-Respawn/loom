# Loom — config COMMUNE à tous les systèmes (versionnée). Les valeurs hardware et les
# secrets vont dans config/local.toml. Détail complet : docs/ + infobulles de la console.

# ============================ Serveur (llama.cpp) ============================
[server]

# Fenêtre de contexte de REPLI, volontairement prudente et NEUTRE (aucune machine
# en tête). La vraie valeur est calibrée PAR MACHINE par loom-setup (étape bench :
# le plus grand cache KV qui tient en RAM sans swap) -> config/local.toml.
context = 8192

# Mono-flux : 1 slot llama-server = tout le pool KV. Par MODÈLE, la sonde du bench
# peut monter à 2 (model.toml cache_isolation = true : cache qui ne survit pas à la
# pollution du slot -> les appels annexes s'isolent dans le 2e slot).
n_parallel = 1

# Cache souverain (save/restore du slot KV par tour) : OFF — nuisible (hybrides),
# inutile (prompt-cache RAM natif) ou cassé (save qui pend) sur llama-server récent.
# Remets true uniquement pour un vieux llama-server sans --cache-ram (cf. config.py).
slot_kv = false

# Reprise à CHAUD one-shot : save du slot en fin de tour + restore UNIQUEMENT sur
# slot froid (serveur (re)démarré, swap de modèle) — évite le re-prefill de reprise
# (~60-85 s sur un 35B) pour ~0,6 s. OFF par défaut (à activer par machine).
hot_resume = false

# Le restore du binaire préserve-t-il les checkpoints des modèles hybrides/SWA ?
# false = officiel non patché : les hybrides sont exclus de la reprise à chaud.
# true = build avec le fix (PR ggml-org #26004) : tous les modèles y ont droit.
restore_safe = false

# Marge VRAM hors couches GPU ; trop bas -> spill mémoire partagée (surveiller nvidia-smi)
gpu_kv_headroom_mb = 640

# Port du serveur modèle (llama-swap)
port = 8080

# Binaires ; mettre le chemin absolu dans local.toml si absents du PATH
bin = "llama-server"
swap_bin = "llama-swap"

# ============================ Override GPU / CPU =============================
# Décommenter pour FORCER l'offload (sinon auto-détecté par serve.py).
[override]
# n_gpu_layers = 35
# threads = 8

# ================================ Stockage ==================================
[storage]
# Racine(s) des modèles — arbo : local/{text,image,video} + remote + _TEMPLATE.
# Par défaut dans le package (loom/models) ; pointe-la vers un gros disque dans
# config/local.toml. Chaîne ou LISTE (plusieurs disques) : ORDONNE du plus rapide
# au plus lent — la PREMIÈRE racine gagne en cas d'id en double ET reçoit les
# nouveaux modèles (/add-model propose le choix quand il y en a plusieurs), ex. :
# models_root = "E:/loom-models"
# models_root = ["C:/loom-models", "E:/loom-models"]

# ========================= Modèles distants (standard) ======================
# Réglages appliqués à TOUS les distants (un dossier remote/<id>/model.toml par
# modèle sous les racines ci-dessus ; gabarit _TEMPLATE/remote-model.toml). Le
# model.toml de chaque dossier surcharge champ par champ. Exemples :
# [remote]
# max_tokens = 8192           # borne de sortie commune (sinon limite du provider)

# ============================== Chat / runtime ==============================
[chat]

# Modèle chargé au démarrage : PAS de défaut ici (ce serait le modèle d'une
# machine en particulier) — repli sur le premier modèle installé ; loom-setup
# écrit le choix de CETTE machine dans config/local.toml.
# default_model = "mon-modele"

# system_prompt centralisé dans loom/prompts/chat.system.md (pas ici)
history_path = "var/conversation.json"
web_port = 8000
skills_dir = "loom/skills"

# Store de plugins (contenu installé git-ignoré)
plugins_root = "loom/plugins"

# Sortie max par tour ; laisse la place au raisonnement + à la réponse
max_tokens = 8192

request_timeout = 120
max_retries = 6

# Budget du résumé inter-tours de l'historique (tokens)
context_token_budget = 5000

# Messages récents laissés intacts lors du résumé
keep_recent_messages = 6

# Réduit le préfixe en gardant les outils cœur + tool_search. Reste désactivé
# jusqu'à validation A/B locale (comportement agentique + cache de préfixe).
deferred_tools = false

# ================================= Outils ===================================
[tools]

# Outils exposés au modèle = la boucle tool-use. Vide -> le modèle ne peut qu'écrire du
# texte. PRÉREQUIS live : llama-server --jinja (serve.py l'inclut) pour les tool_calls.
enabled = [
    "find_files", "search_text", "list_dir",
    "read_file", "read_image", "calculate", "current_date",
    "web_search", "fetch_url",
    "dispatch_agent", "run_workflow", "manage_todos", "write_note", "read_note",
    "recall", "remember",
    "write_file", "append_file", "edit_file",
    "format_code", "run_shell", "monitor",
    "check_page", "serve_and_check",
    "use_skill",
    # Plugins (list_plugins, add_marketplace, install_plugin) : HORS du set par
    # défaut depuis 2026-07-15 — opérations de setup jamais appelées par le modèle
    # en usage réel (~300 tokens de schémas). Ajoute-les ici pour les réactiver.
]

# Racine autorisée des outils (anti-traversal) ; surchargée dans local.toml
workspace_dir = "."

# Cap par appel read_file (caractères) ; au-delà, lecture par tranches
read_file_max_bytes = 40000

# ============================== Recherche web ===============================
[web_search]

# false = extraits des résultats (rapide) ; true = scrape complet des pages
fetch_pages = false

# =============================== Permissions ================================
[permissions]

# allow = write/edit/run_shell sans confirmation ; la deny-list dure reste active
mode = "allow"

# =========================== Serveurs MCP tiers =============================
# Configuration machine à placer de préférence dans config/local.toml :
#
# [[mcp_servers]]
# name = "fichiers-equipe"
# transport = "stdio"
# command = "uvx"
# args = ["mon-serveur-mcp"]
# env = { API_KEY = "secret-machine" }
# enabled = true
# timeout_s = 10
# danger_override = false  # seulement si TOUT ce serveur est explicitement fiable

# ============================= Modèles distants =============================
# Ne se déclarent PAS ici (secrets). Gère-les via la console de l'UI (onglet Modèles
# distants), ou copie l'exemple : config/local.example.toml -> config/local.toml.
