# Loom — config COMMUNE à tous les systèmes (versionnée). Les valeurs hardware et les
# secrets vont dans config/local.toml. Détail complet : docs/ + infobulles de la console.

# ============================ Serveur (llama.cpp) ============================
[server]

# Fenêtre de contexte ; tient sur 6 Go avec KV q8_0. cf. docs/perf-gpu.md
context = 24576

# Mono-flux : 1 slot llama-server = tout le pool KV
n_parallel = 1

# Marge VRAM hors couches GPU ; trop bas -> spill mémoire partagée (surveiller nvidia-smi)
gpu_kv_headroom_mb = 640

# Port du serveur modèle (llama-swap)
port = 8080

# Binaires ; mettre le chemin absolu dans local.toml si absents du PATH
bin = "llama-server"
swap_bin = "llama-swap"

# ============================ Override GPU / CPU =============================
# Décommenter pour FORCER l'offload (sinon auto-détecté par serve.py).
[override]
# n_gpu_layers = 35
# threads = 8

# ================================ Stockage ==================================
[storage]
# Racine des modèles — arbo : local/{text,image,video} + remote + _TEMPLATE.
# Par défaut dans le package (loom/models) ; pointe-la vers un gros disque dans
# config/local.toml, ex. :
# models_root = "E:/loom-models"

# ============================== Chat / runtime ==============================
[chat]

# Modèle chargé au démarrage (le sélecteur de l'UI hot-swap ensuite)
default_model = "qwen3.6-35b-a3b-abliterated"

# system_prompt centralisé dans loom/prompts/chat.system.md (pas ici)
history_path = "var/conversation.json"
web_port = 8000
skills_dir = "loom/skills"

# Store de plugins (contenu installé git-ignoré)
plugins_root = "loom/plugins"

# Sortie max par tour ; laisse la place au raisonnement + à la réponse
max_tokens = 8192

request_timeout = 120
max_retries = 6

# Budget du résumé inter-tours de l'historique (tokens)
context_token_budget = 5000

# Messages récents laissés intacts lors du résumé
keep_recent_messages = 6

# ================================= Outils ===================================
[tools]

# Outils exposés au modèle = la boucle tool-use. Vide -> le modèle ne peut qu'écrire du
# texte. PRÉREQUIS live : llama-server --jinja (serve.py l'inclut) pour les tool_calls.
enabled = [
    "find_files", "search_text", "list_dir",
    "read_file", "read_document", "read_image",
    "web_search", "fetch_url",
    "dispatch_agent", "manage_todos", "write_note", "read_note",
    "recall", "remember",
    "write_file", "append_file", "edit_file",
    "format_code", "run_shell",
    "check_page", "check_interactive", "serve_and_check",
    "use_skill", "list_plugins", "add_marketplace", "install_plugin",
]

# Racine autorisée des outils (anti-traversal) ; surchargée dans local.toml
workspace_dir = "."

# Cap par appel read_file (caractères) ; au-delà, lecture par tranches
read_file_max_bytes = 40000

# ============================== Recherche web ===============================
[web_search]

# false = extraits des résultats (rapide) ; true = scrape complet des pages
fetch_pages = false

# =============================== Permissions ================================
[permissions]

# allow = write/edit/run_shell sans confirmation ; la deny-list dure reste active
mode = "allow"

# ============================= Modèles distants =============================
# Ne se déclarent PAS ici (secrets). Gère-les via la console de l'UI (onglet Modèles
# distants), ou copie l'exemple : config/local.example.toml -> config/local.toml.
