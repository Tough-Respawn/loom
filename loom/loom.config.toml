# Config Loom — paramètres NON liés au hardware.
# Les valeurs hardware (n_gpu_layers, threads) sont auto-détectées par serve.py ;
# on ne les met ici (section [override]) que pour forcer/plafonner.
# Le chemin du binaire spécifique à une machine va dans loom.config.local.toml.

# DEUX modèles -> serve.py lance llama-swap (hot-swap par le sélecteur de l'UI selon le
# champ `model` de la requête). default_model ci-dessous = celui chargé par défaut.

[[models]]
# Gemma 4 E4B *abliterated* (non censuré) — Gemma 3n E4B (effectif ~4B). Q4_K_M ~5.34 Go,
# vision via mmproj-F16. PLE en RAM -> CPU-bound mais sliding-window -> KV léger -> ~1,7 Go
# de VRAM libre, ~33 tok/s STABLE, pas de spill. C'est le défaut (le plus sûr sur 6 Go).
id = "gemma-uncensored"
repo = "mradermacher/gemma-4-E4B-it-uncensored-GGUF"
filename = "gemma-4-E4B-it-uncensored.Q4_K_M.gguf"
mmproj_filename = "mmproj-F16.gguf"   # "" pour désactiver la vision
n_layers = 35
size_mb = 5340

[[models]]
# Qwen3.5-4B abliterated (Huihui) — dense 4B 2026, TEXTE seul. Q4_K_M ~2,8 Go -> laisse
# ~3 Go VRAM libres sur 6 Go => PAS de spill (contrairement au Qwen3-VL 8B, acté inviable
# le 2026-06-06, cf. mémoire loom-choix-modele) et contexte 24576 tient. Modèle récent
# censé taper au-dessus de Gemma E4B sans sortir des 6 Go. À tester via le sélecteur UI.
id = "qwen3.5-4b-abliterated"
repo = "mradermacher/Huihui-Qwen3.5-4B-abliterated-GGUF"
filename = "Huihui-Qwen3.5-4B-abliterated.Q4_K_M.gguf"
mmproj_filename = ""   # texte seul (pas de vision)
n_layers = 36
size_mb = 2800

[server]
# Contexte 24576 : large fenêtre pour une boucle tool-use qui enchaîne lectures et
# résultats d'outils. Gemma supporte 131072 ; avec sliding-window (n_swa=512) + KV q8_0
# le KV reste léger -> 24576 tient sur 6 Go. cf. docs/perf-gpu.md.
context = 24576
# Slots de llama-server (--parallel). Loom est mono-flux : un seul échange à la fois
# (verrou de chat) et le sous-agent tourne en synchrone -> 1 seul slot, qui dispose
# alors de TOUT le pool KV (-c). Le 4 d'avant venait du fan-out, supprimé.
n_parallel = 1
# Marge VRAM (Mo) réservée hors couches GPU (cache KV + buffers de calcul). En mono-flux,
# plus besoin de réserver pour des slots concurrents -> on l'abaisse pour offloader plus de
# couches et saturer le GPU. Vise ~99% de la VRAM : descends par paliers (640 -> 512 -> 384)
# en surveillant `nvidia-smi` (la "Shared GPU memory" doit rester à 0 ; si elle monte, c'est
# le spill qui écroule les perfs -> remonte la marge). serve.py loggue les couches offloadées.
gpu_kv_headroom_mb = 640
port = 8080
# Binaire llama-server : "llama-server" si dans le PATH, sinon override en local.
bin = "llama-server"
# Binaire llama-swap (routeur multi-modèles) : "llama-swap" si dans le PATH.
swap_bin = "llama-swap"

[override]
# n_gpu_layers = 35   # décommenter pour forcer l'offload total si le modèle tient
# threads = 8

[chat]
default_model = "gemma-uncensored"
# system_prompt : non défini ici -> centralisé dans loom/prompts/chat.system.md
history_path = "loom/data/conversation.json"
web_port = 8000
skills_dir = "loom/skills"
# 4096 (au lieu de 2048) : laisse passer des réponses/écritures plus grosses sans
# troncature. La vraie parade au gros fichier reste le chunk (write_file + append_file).
max_tokens = 4096
request_timeout = 120
max_retries = 6
context_token_budget = 5000
keep_recent_messages = 6

[tools]
# Boucle tool-use : les outils exposés au modèle. C'est LE harness — le modèle agit
# en appelant le bon outil au bon moment. Vide => aucun outil (le modèle ne peut qu'écrire
# du texte). PRÉREQUIS live : llama-server avec --jinja (serve.py l'inclut) pour que le
# modèle émette des tool_calls structurés.
enabled = [
    "find_files", "search_text", "list_dir",
    "read_file", "read_document", "read_image",
    "web_search", "fetch_url",
    "dispatch_agent", "manage_todos",
    "write_file", "append_file", "edit_file",
    "replace_lines", "insert_lines", "format_code", "run_shell",
    "check_page",
]
# Périmètre des outils : racine de tes projets (anti-traversal). Surchargé par
# loom.config.local.toml pour pointer la vraie racine de la machine.
workspace_dir = "."
# Cap par appel read_file (caractères) : bas devant le contexte (24576) -> un gros
# fichier se lit par tranches (start_line) au lieu de tout charger et déborder.
read_file_max_bytes = 40000

[web_search]
# snippet-first : on utilise les extraits des résultats au lieu de scraper les
# pages (évite les 403/rate-limit, plus rapide). Passe à true pour du contenu
# complet (recherche approfondie) quand un backend fiable (SearXNG/Tavily) est en place.
fetch_pages = false

[permissions]
# mode = "allow" : write_file/edit_file/run_shell s'exécutent SANS confirmation
# (agent autonome, plus de blocage sur les bulles Autoriser). La deny-list DURE
# (rm -rf, Remove-Item -Recurse -Force, format, dd if=…) reste incontournable même
# en allow. Repasser à "ask" pour ré-activer la confirmation.
mode = "allow"
