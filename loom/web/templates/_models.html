<select id="model-select" name="model" hx-post="/model" hx-target="#model-select"
        hx-swap="outerHTML">
  {% for mid in models %}
    <option value="{{ mid }}"{% if mid == current_model %} selected{% endif %}{% if model_descriptions and model_descriptions.get(mid) %} title="{{ model_descriptions.get(mid) }}"{% endif %}>{% if mid in remote_model_ids %}remote · {% elif video_model_ids and mid in video_model_ids %}video · {% elif image_model_ids and mid in image_model_ids %}image · {% else %}home · {% endif %}{{ mid }}</option>
  {% endfor %}
</select>
