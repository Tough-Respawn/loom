<div id="skills-panel">
  {% if skills %}
    <label class="skill skills-all" title="Activer / désactiver tous les skills">
      <input type="checkbox" id="skills-all"> <span class="muted">tous</span>
    </label>
    {% for s in skills %}
      <div class="skill skill-row{% if s.name in overridden_skills %} has-override{% endif %}"
           title="{{ s.description }}">
        <input type="checkbox" class="skill-cb" data-name="{{ s.name }}"
               {% if s.name in active_skills %}checked{% endif %}>
        <button type="button" class="skill-name" data-name="{{ s.name }}"
                title="Voir / éditer ce skill">{{ s.name }}</button>
        <span class="skill-origin o-{{ s.origin }}"
              title="{% if s.origin == 'loom' %}skill par défaut du package{% elif s.origin == 'user' %}ajouté par toi{% elif s.origin == 'learned' %}auto-appris par le modèle{% else %}installé via un plugin{% endif %}">{{ s.origin }}</span>
        {% if s.origin in ('learned', 'user') %}
        <button type="button" class="skill-del" data-name="{{ s.name }}"
                title="Supprimer ce skill (fichier retiré du disque)">✕</button>
        {% endif %}
      </div>
    {% endfor %}
  {% else %}
    <span class="muted">Aucun skill. Installe un plugin (install_plugin), crée-en un
      (+ new) ou ajoute loom/skills/&lt;nom&gt;/SKILL.md</span>
  {% endif %}
</div>
