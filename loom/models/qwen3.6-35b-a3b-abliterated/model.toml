# Qwen3.6 35B-A3B abliterated (huihui) — MoE : 35B totaux, ~3B ACTIFS par token.
# GROS modele rendu jouable sur 6 Go via offload MoE (cf. guide llama.cpp Doctor-Shotgun) :
#   -ngl 999 --cpu-moe  => attention + FFN dense + expert partage sur GPU,
#                          experts ROUTES (gros, peu sollicites) en RAM.
# Resultat attendu sur RTX 2060 6 Go + 32 Go RAM : qualite ~classe-30B, gen ~15 tok/s,
# prefill ~350-400 tok/s. Prerequis : ~18-20 Go de RAM libre (fermer apps lourdes).
# Tuning : si VRAM OK, monter -c et -ub ; sinon baisser -c. Fallback si --cpu-moe absent :
#   -ot "exps=CPU". Pour deborder un peu plus en RAM : --n-cpu-moe N (N couches d'experts).
# PAS de vision (mmproj non inclus dans cette abliteration). id = nom du dossier.
repo = "mradermacher/Huihui-Qwen3.6-35B-A3B-abliterated-GGUF"
filename = "Huihui-Qwen3.6-35B-A3B-abliterated.Q4_K_M.gguf"
# Vision : mmproj (614 Mo) gardé en RAM via --no-mmproj-offload (auto) -> Qwen voit les
# images (screenshots) sans manger la VRAM tendue. Qwen3.6 est multimodal.
mmproj_filename = "Huihui-Qwen3.6-35B-A3B-abliterated.mmproj-Q8_0.gguf"
n_layers = 40
size_mb = 20400
cpu_moe = true
# Offload partiel : garde ~5 couches d'experts sur GPU (40-35) pour remplir la VRAM (~5 Go)
# et accélérer. À tuner empiriquement (lire nvidia-smi, viser ~85% des 6 Go, jamais le spill).
n_cpu_moe = 35
context = 24576
