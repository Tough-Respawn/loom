[project]
name = "loom"
version = "0.1.0"
description = "Loom — fondation runtime pour LLM local (sous-projet A)"
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=0.25",
    "openai>=1.50",
    "flask>=3.0",
    "httpx>=0.27",
    "trafilatura>=1.12",
    "pypdf>=6.12.2",
    "openpyxl>=3.1.5",
    "python-docx>=1.2.0",
    "playwright>=1.60.0",
    # ruff : utilisé au RUNTIME par l'outil format_code (formate le Python que le modèle
    # écrit). Vrai besoin de Loom, pas seulement du dev -> présent dans le venv, hors-ligne.
    "ruff>=0.6",
    "psutil>=7.2.2",
    "tomlkit>=0.13",
]

[project.optional-dependencies]
web-search = [
    "ddgs>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["loom"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
