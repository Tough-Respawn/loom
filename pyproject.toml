[project]
name = "loom"
version = "0.1.0"
description = "Loom — fondation runtime pour LLM local (sous-projet A)"
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=0.25",
    "requests>=2.32",
    "openai>=1.50",
    "flask>=3.0",
    "httpx>=0.27",
    "trafilatura>=1.12",
    "pypdf>=6.12.2",
    "openpyxl>=3.1.5",
    "python-docx>=1.2.0",
]

[project.optional-dependencies]
web-search = [
    "ddgs>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["loom"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
