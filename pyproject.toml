[project]
name = "loom"
version = "0.1.0"
description = "Loom — fondation runtime pour LLM local (sous-projet A)"
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=0.25",
    "openai>=1.50",
    "flask>=3.0",
    "httpx>=0.27",
    "curl-cffi>=0.7",
    "trafilatura>=1.12",
    "pypdf>=6.12.2",
    "openpyxl>=3.1.5",
    "python-docx>=1.2.0",
    "playwright>=1.60.0",
    # L'Âme (export/import chiffré) : AES-GCM + scrypt, et jauge de passphrase offline.
    "cryptography>=43",
    # web_search (ddgs) : dépendance de BASE, plus un extra — un uv sync standard
    # DÉSINSTALLE les extras (sync exact) et l'outil web_search tombait en panne
    # (vécu 2026-07-22). La dégradation hors-ligne est gérée au runtime, pas
    # par l'absence de la lib.
    "ddgs>=6.0",
    "zxcvbn>=4.4",
    # ruff : utilisé au RUNTIME par l'outil format_code (formate le Python que le modèle
    # écrit). Vrai besoin de Loom, pas seulement du dev -> présent dans le venv, hors-ligne.
    "ruff>=0.6",
    "psutil>=7.2.2",
    "tomlkit>=0.13",
    "truststore>=0.10",
]

[project.scripts]
# Installeur guidé : binaire llama.cpp + premier modèle. `uv run loom-setup`
loom-setup = "loom.setup.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["loom"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
