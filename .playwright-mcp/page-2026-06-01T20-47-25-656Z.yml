        - text: Georges Danton est avant tout un homme de rhétorique. Son éloquence, empreinte de simplicité populaire et de passion, faisait de lui un orateur incontournable dans les tribunes du Palais-Royal et devant les assemblées révolutionnaires. Au début de la Révolution, il s'impose comme une voix puissante, capable de galvaniser les masses, notamment la
        - emphasis [ref=e21]: sans-culotte
        - text: parisienne.
      - paragraph [ref=e22]: Il n'était pas un théoricien froid ; il était un militant pragmatique, profondément ancré dans la volonté de justice immédiate et de changement social. Lorsque la monarchie de droit divin s'effondre, Danton est parmi ceux qui poussent vers l'action radicale.
