      - paragraph [ref=e16]: Georges Danton est une figure centrale, dramatique et charismatique, dont l'histoire personnelle est inextricablement liée aux hauts et aux bas de la Terreur révolutionnaire. Sa carrière est celle de l'orateur brillant, du militant passionné, mais aussi de l'homme qui, au moment critique, a voulu faire appel à la clémence humaine au cœur de la fureur révolutionnaire.
      - paragraph [ref=e17]: Voici un récit détaillé de son parcours et de son rôle dans les événements les plus sombres de la Révolution.
